
name: NOVA Store CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Package application
        run: |
          mkdir -p dist
          zip -r dist/nova-store-flask.zip \
            app data/products.json run.py requirements.txt README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-store-flask
          path: dist/nova-store-flask.zip

  automated-testing:
    name: Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  code-quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Flake8
        run: python -m flake8 app tests run.py

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    needs:
      - build
      - automated-testing
      - code-quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Request Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"
